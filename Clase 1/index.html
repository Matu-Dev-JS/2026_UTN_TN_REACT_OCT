<!-- 
HTML es lenguaje de etiqutas, las etiquetas tienen un significado/funcionalidad
Existen 2 tipos de etiquetas
<div></div>: De cierre
    Pueden tener contenido anidado

<img/> o <img>: De autocierre
    No tienen contenido anidado

Cada etiqueta tiene un ELEMENTO, el elmento es quien DEFINE el significado o funcionalidad Y QUE TIPO DE ETIQUETA ES
    head: Define una lista de metadatos
    title: Define el titulo del documeto
    h1: El titulo con mas jerarquia de tu pagina
    img: Incorporar una imagen en la pagina

Cada elemento puede tener ATRIBUTOS, los atributos son caracteristicas del elemento
    
-->
